name: Daily intro nudge

on:
  schedule:
    - cron: "0 17 * * *"   # ~11am Mountain
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only show who would be welcomed"
        default: "true"

jobs:
  nudge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crimpers-bot/tools/intro_nudge.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID:          ${{ vars.GUILD_ID }}
          INTRO_CHANNEL_ID:  ${{ vars.INTRO_CHANNEL_ID }}
          MEMBER_ROLE_ID:    ${{ vars.MEMBER_ROLE_ID }}
          DRY_RUN:           ${{ inputs.dry_run || 'false' }}
