name: Deploy intro worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["intro-worker/**"]

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: intro-worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make sure the account has a workers.dev subdomain
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && exit 0
          ACCT=$(grep '^account_id' wrangler.toml | cut -d'"' -f2)
          API="https://api.cloudflare.com/client/v4/accounts/$ACCT/workers/subdomain"
          current=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "$API" | jq -r '.result.subdomain // empty')
          if [ -n "$current" ]; then echo "subdomain: $current.workers.dev"; exit 0; fi
          for name in crimpers crimpers-bot crimpers-intro; do
            out=$(curl -s -X PUT -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" -H "Content-Type: application/json" \
                  -d "{\"subdomain\":\"$name\"}" "$API")
            if [ "$(echo "$out" | jq -r .success)" = "true" ]; then echo "registered: $name.workers.dev"; exit 0; fi
            echo "$name not available: $(echo "$out" | jq -c .errors)"
          done
          exit 1
      - name: Deploy and pass the bot token to the Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DISCORD_BOT_TOKEN:    ${{ secrets.DISCORD_BOT_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then echo "CLOUDFLARE_API_TOKEN secret not set yet - skipping."; exit 0; fi
          npx --yes wrangler@4 deploy
          echo "$DISCORD_BOT_TOKEN" | npx --yes wrangler@4 secret put DISCORD_BOT_TOKEN
