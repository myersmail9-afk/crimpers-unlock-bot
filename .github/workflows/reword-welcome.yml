name: Reword welcome posts

on:
  workflow_dispatch:

jobs:
  reword:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python crimpers-bot/tools/reword_welcome.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID:          ${{ vars.GUILD_ID }}
          INTRO_CHANNEL_ID:  ${{ vars.INTRO_CHANNEL_ID }}
          MEMBER_ROLE_ID:    ${{ vars.MEMBER_ROLE_ID }}
