name: Unlock introduced members

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Grant Member to anyone who introduced themselves
        run: cd crimpers-bot && python sweep.py
        env:
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          GUILD_ID: ${{ vars.GUILD_ID }}
          INTRO_CHANNEL_ID: ${{ vars.INTRO_CHANNEL_ID }}
          MEMBER_ROLE_ID: ${{ vars.MEMBER_ROLE_ID }}
